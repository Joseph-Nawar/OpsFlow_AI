services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow -d opsflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPSFLOW_DATABASE_URL: postgresql+asyncpg://opsflow:opsflow@postgres:5432/opsflow
      OPSFLOW_ORCHESTRATION_TOKEN: ${OPSFLOW_ORCHESTRATION_TOKEN:-}
      OPSFLOW_REVIEW_DEV_OPERATORS: ${OPSFLOW_REVIEW_DEV_OPERATORS:-}
      OPSFLOW_REVIEW_BASE_URL: ${OPSFLOW_REVIEW_BASE_URL:-http://localhost:5173}
    ports:
      - "8000:8000"

  n8n:
    image: n8nio/n8n:2.40.5
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  postgres-data:
  n8n-data:
