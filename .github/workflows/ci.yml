name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      OPSFLOW_DATABASE_URL: postgresql+asyncpg://opsflow:opsflow@localhost:5432/opsflow
      OPSFLOW_INTEGRATION_TEST_DATABASE_URL: postgresql+asyncpg://opsflow:opsflow@localhost:5432/opsflow_integration_ci
      OPSFLOW_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://opsflow:opsflow@localhost:5432/opsflow_migration_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow
          POSTGRES_DB: opsflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsflow -d opsflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.2"

      - name: Install backend dependencies
        run: uv sync --frozen --dev

      - name: Create isolated migration-test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  user="opsflow",
                  password="opsflow",
                  database="postgres",
                  host="localhost",
              )
              try:
                  await connection.execute("CREATE DATABASE opsflow_migration_test")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Create isolated integration-test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  user="opsflow",
                  password="opsflow",
                  database="postgres",
                  host="localhost",
              )
              try:
                  await connection.execute("CREATE DATABASE opsflow_integration_ci")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migration state
        run: uv run alembic current

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src/opsflow

      - name: Run backend tests
        run: uv run pytest

      - name: Build Python package
        run: uv build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  dependency-security:
    name: Production dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.2"

      - name: Audit frozen production Python dependencies
        run: make dependency-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high --prefix web

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          git --redact --no-banner --verbose
          --log-opts="--all --full-history" /repo
